<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Empréstimo - NeiBank</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
h2{
    color: #CAAB66;
    padding: 15px;
}


input{
    height: 25px;
    border-radius: 6px;
    text-align: center;
}
.home-btn{
    padding: 10px;
}

.class{
    display: flex;
  
}

img{
      width: 200px;
}
    .card-pendente {
    display: flex;
    justify-content: space-between; /* Espaça os elementos horizontalmente */
    align-items: center;
    border: 1px solid #CAAB66;
    border-radius: 6px;
    padding: 10px 15px;
    margin-bottom: 10px;
    background-color: rgba(0,0,0,0.6);
    color: white;
    gap: 15px; /* Espaço entre os itens */
}

.card-pendente p {
    margin: 0;
}

.card-pendente button.pago {
    padding: 5px 10px;
    background-color: #CAAB66;
    color: black;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: 0.2s;
}

.card-pendente button.pago:hover {
    background-color: #b58c50;
}

  </style>
</head>
<body class="pendencia">
  <header>
    <h1>NeiBank</h1>
  </header>

  <main>
    <h2>Pendente de pagamento</h2>

    <div class="pendente">
        
    </div>

    <div class="home-btn">
      <a href="index.html"><i class="fa-solid fa-house"></i> Voltar ao Dashboard</a>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
