<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Empréstimo - NeiBank</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
h2{
    color: #CAAB66;
    padding: 15px;
}

form{
    display: flex;
    text-align: center;
    align-items: center;
}

label{
    color:#CAAB66;
    padding: 10px;
    align-items: center;
}

input{
    height: 25px;
    border-radius: 6px;
    text-align: center;

}
.home-btn{
    padding: 10px;
    
}


button{
    color: #CAAB66;
    background-color:rgba(235, 204, 149, 0.129);
    border-radius: 6px;
    width: 55px;
    height: 20px;
    margin-top: 3px;
}

@media(max-width:1030px){

        h1{
            font-size: 35px;
        }
    
    form{
        display: flex;
        flex-direction: column;
        flex-wrap: wrap;
       text-align: center;
    }
     input{
    padding: 5px;
    margin-right:5px;
 }

.salvar{
    display: flex;
    flex-direction: column;
    align-items: center;
 }
    
}
 button{
    margin-top: 10px;
    width: 100px;
 }

@media(max-width: 768px){
    
   

 form{
    flex-wrap: wrap;
    flex-direction: column;
    display: flex;
    align-items: center;
 }

 input{
    padding: 10px;
    margin-right:5px;
 }

 .salvar{
    display: flex;
    flex-direction: column;
    align-items: center;
 }
 a{
    align-items: center;
 }

 button{
    margin-top: 10px;
    width: 100px;
 }

}
    
  </style>
</head>
<body class="emprestimo">
  <header>
    <h1>NeiBank</h1>
  </header>

  <main>
    <h2>Cadastrar novo empréstimo</h2>

    <form class="form-emprestimo">
      <label>Nome do cliente</label>
      <input type="text" placeholder="Ex: João Silva">

      <label>Valor emprestado</label>
      <input type="number" placeholder="R$ 0,00">

      
      <label class="fim">juros (%)</label>
      <div class="salvar">
      <select name="" id="juros">
        <option value="10">10%</option>
        <option value="20">20%</option>
        <option value="30">30%</option>
      </select>
      <button type="submit" id="salvar">Salvar</button>
      </div>
    </form>

    <div class="home-btn">
      <a href="index.html"><i class="fa-solid fa-house"></i> Voltar ao Dashboard</a>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
